spring.application.name=claimcheck

# --- MySQL (credentials come from environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/claimcheck?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:claimcheck_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA (ddl-auto=update is for this local prototype only) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Fictional business rule ---
claimcheck.rules.submission-deadline-days=30

# --- Gemini API. Key is optional; only /api/ai/extract-claim needs it. ---
claimcheck.ai.api-key=${GEMINI_API_KEY:}
claimcheck.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
claimcheck.ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
claimcheck.ai.timeout-seconds=30
